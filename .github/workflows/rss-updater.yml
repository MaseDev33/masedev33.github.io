name: Update RSS Mirror

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: rss-mirror
  cancel-in-progress: false

jobs:
  update-rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download latest Beehiiv RSS feed
        run: |
          set -euo pipefail
          curl -fsSL https://rss.beehiiv.com/feeds/733ZbkQv2J.xml -o rss.xml.new

      - name: Replace local mirror and refresh repository state
        run: |
          set -euo pipefail
          if cmp -s rss.xml rss.xml.new; then
            echo "RSS feed unchanged."
          else
            mv rss.xml.new rss.xml
            echo "RSS feed updated."
          fi

          git pull --ff-only || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update RSS mirror"
          git push
