name: Update RSS Mirror

on:
  workflow_dispatch:

concurrency:
  group: rss-mirror
  cancel-in-progress: false

jobs:
  update-rss:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Beehiiv RSS feed
        run: |
          set -euo pipefail
          curl -fsSL https://rss.beehiiv.com/feeds/733ZbkQv2J.xml -o rss.xml.new

      - name: Compare RSS
        id: compare
        run: |
          if [ -f rss.xml ] && cmp -s rss.xml rss.xml.new; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "RSS unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "RSS changed."
          fi

      - name: Update rss.xml
        if: steps.compare.outputs.changed == 'true'
        run: |
          mv rss.xml.new rss.xml

      - name: Commit RSS update
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rss.xml
          git commit -m "chore: update RSS mirror"
          git push
