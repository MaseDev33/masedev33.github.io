name: Update RSS Mirror

on:
  workflow_dispatch:

concurrency:
  group: rss-mirror
  cancel-in-progress: false

jobs:
  update-rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Beehiiv RSS
        run: |
          curl -fsSL https://rss.beehiiv.com/feeds/733ZbkQv2J.xml -o rss.new.xml

      - name: Compare RSS posts only
        id: compare
        run: |
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          import hashlib
          import os

          def get_hash(file):
              root = ET.parse(file).getroot()
              items = []

              for item in root.findall(".//item"):
                  items.append(
                      (
                          item.findtext("title", ""),
                          item.findtext("link", ""),
                          item.findtext("guid", "")
                      )
                  )

              return hashlib.sha256(
                  repr(items).encode()
              ).hexdigest()

          old = get_hash("rss.xml") if os.path.exists("rss.xml") else ""
          new = get_hash("rss.new.xml")

          if old == new:
              print("No new posts.")
              open("changed", "w").write("false")
          else:
              print("New posts detected.")
              open("changed", "w").write("true")
          PY

      - name: Update rss.xml
        run: |
          if [ "$(cat changed)" = "true" ]; then
            mv rss.new.xml rss.xml
          else
            rm rss.new.xml
          fi

      - name: Commit RSS update
        if: hashFiles('changed') != ''
        run: |
          if [ "$(cat changed)" != "true" ]; then
            echo "Nothing changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rss.xml
          git commit -m "chore: update RSS mirror"
          git push
