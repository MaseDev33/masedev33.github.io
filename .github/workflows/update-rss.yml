name: Update RSS Mirror

on:
  push:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: rss-mirror
  cancel-in-progress: false

jobs:
  update-rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download latest Beehiiv RSS feed
        run: |
          set -euo pipefail
          curl -fsSL https://rss.beehiiv.com/feeds/733ZbkQv2J.xml -o rss.xml.new

      - name: Replace local mirror if changed
        run: |
          set -euo pipefail
          if cmp -s rss.xml rss.xml.new; then
            echo "RSS feed unchanged."
            rm -f rss.xml.new
            exit 0
          fi

          mv rss.xml.new rss.xml
          git pull --ff-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml
          git commit -m "chore: update RSS mirror" || echo "No changes to commit."
          git push
